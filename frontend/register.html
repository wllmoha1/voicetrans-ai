<!DOCTYPE html>
<html lang="so" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is Diiwaangeli - VoiceTrans AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="glass-panel w-full max-w-lg p-8 sm:p-10 my-8">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/30 mb-4">
        🎙️
      </div>
      <h2 class="text-2xl font-bold text-white">Sameyso Akoon Cusub</h2>
      <p class="text-sm text-slate-400 mt-1">Ku biir nidaamka wicitaanka cod-ilaa-codka ee AI</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div id="errorAlert" class="hidden p-3 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300 text-xs"></div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Magacaaga Buuxa</label>
        <input type="text" id="fullName" required placeholder="tusaale Cali Maxamed" 
               class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
          <input type="text" id="username" required placeholder="ali2026" 
                 class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
          <input type="email" id="email" required placeholder="ali@example.com" 
                 class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" 
               class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Language & Voice Preferences -->
      <div class="pt-2 border-t border-slate-800">
        <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-3">Dookha Luqadahaaga</span>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Luqadda Aad Ku Hadlayso</label>
            <select id="nativeLang" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
              <!-- Populated by JS -->
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Luqadda Aad Rabto Inaad Ku Maqasho</label>
            <select id="targetLang" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
              <!-- Populated by JS -->
            </select>
          </div>
        </div>

        <div class="mt-3">
          <label class="block text-xs font-semibold text-slate-300 mb-1">Dooro Codka AI-da ee Laguugu Hadlaayo</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-300">
              <input type="radio" name="voiceGender" value="male" checked class="text-indigo-600 focus:ring-indigo-500">
              <span>👨 Lab (Muuse / Guy / Hamed)</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-300">
              <input type="radio" name="voiceGender" value="female" class="text-indigo-600 focus:ring-indigo-500">
              <span>👩 Dhedig (Ubax / Jenny / Salma)</span>
            </label>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full mt-4 py-3 rounded-xl font-semibold bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white shadow-lg shadow-indigo-500/30 transition flex items-center justify-center gap-2">
        <span>Diiwaangeli Akoonka</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Akoon ma leedahay? <a href="/login" class="text-indigo-400 hover:underline font-semibold">Halkan ka gal (Login)</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    async function loadLanguages() {
      try {
        const res = await fetch("/api/languages");
        const data = await res.json();
        const langs = data.languages || [];

        const nativeSelect = document.getElementById("nativeLang");
        const targetSelect = document.getElementById("targetLang");

        langs.forEach(l => {
          const opt1 = document.createElement("option");
          opt1.value = l.code;
          opt1.textContent = `${l.flag || ''} ${l.name}`;
          if (l.code === "so") opt1.selected = true;
          nativeSelect.appendChild(opt1);

          const opt2 = document.createElement("option");
          opt2.value = l.code;
          opt2.textContent = `${l.flag || ''} ${l.name}`;
          if (l.code === "en") opt2.selected = true;
          targetSelect.appendChild(opt2);
        });
      } catch (e) {
        console.error("Language load failed:", e);
      }
    }

    loadLanguages();

    const form = document.getElementById("registerForm");
    const errorAlert = document.getElementById("errorAlert");
    const submitBtn = document.getElementById("submitBtn");

    form.onsubmit = async (e) => {
      e.preventDefault();
      errorAlert.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Waa la diiwaangelinayaa...";

      const payload = {
        full_name: document.getElementById("fullName").value,
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        native_language: document.getElementById("nativeLang").value,
        target_language: document.getElementById("targetLang").value,
        preferred_voice: document.querySelector('input[name="voiceGender"]:checked').value
      };

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let data;
        try {
          data = await res.json();
        } catch (_) {
          data = { detail: "Khalad ayaa ka dhacay server-ka (" + res.status + ")" };
        }
        if (res.ok) {
          Auth.setToken(data.access_token);
          Auth.setUser(data.user);
          window.location.href = "/dashboard";
        } else {
          errorAlert.textContent = data.detail || "Khalad ayaa dhacay.";
          errorAlert.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Diiwaangeli Akoonka";
        }
      } catch (err) {
        errorAlert.textContent = "Server-ka lama xiriiri karo: " + err.message;
        errorAlert.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Diiwaangeli Akoonka";
      }
    };
  </script>
</body>
</html>
